version: '3.8'
services:
  db:
    image: postgres:15
    container_name: briefly-db
    restart: always
    environment:
      POSTGRES_DB: briefly_db
      POSTGRES_USER: briefly
      POSTGRES_PASSWORD: briefly_pwd
    ports:
      - "5432:5432"
    volumes:
      - briefly_data:/var/lib/postgresql/data

volumes:
  briefly_data:
